services:
  # ============================================
  # MariaDB Database
  # Dùng MariaDB thay MySQL vì tối ưu hiệu năng cao hơn cho WordPress.
  # ============================================
  wp-db:
    container_name: wp-db
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'healthcheck.sh --connect --innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wp-network

  # ============================================
  # WordPress (Apache + PHP)
  # Mount chi tiết từng thư mục wp-content để phát triển theme/plugin.
  # ============================================
  wordpress:
    container_name: wordpress
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-false}
      # Authentication Keys & Salts (Bảo mật cookies)
      WORDPRESS_AUTH_KEY: ${WP_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WP_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WP_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WP_NONCE_SALT}
    ports:
      - '${WP_PORT:-8080}:80'
    volumes:
      # ── PHP Configuration ──
      # Custom php.ini cho upload size, memory limit, execution time
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

      # ── WordPress Source (Phát triển Theme & Plugin) ──
      # Mount toàn bộ wp-content ra ngoài để dev có toàn quyền chỉnh sửa
      - ./src/wp-content/themes:/var/www/html/wp-content/themes
      - ./src/wp-content/plugins:/var/www/html/wp-content/plugins
      - ./src/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

      # ── Persistent Data (Docker Volume) ──
      # Uploads (media) dùng Docker volume vì chứa file binary lớn, không cần track Git
      - wp-uploads:/var/www/html/wp-content/uploads

      # WordPress core files (tránh mất khi rebuild container)
      - wp-core:/var/www/html
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsSL http://localhost:80/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wp-network

  # ============================================
  # WP-CLI - Công cụ quản trị WordPress qua dòng lệnh
  # Chạy dạng "sidecar", chỉ khởi động khi cần dùng.
  # Ví dụ: docker compose run --rm wpcli plugin list
  # ============================================
  wpcli:
    container_name: wpcli
    image: wordpress:cli
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    volumes:
      - wp-core:/var/www/html
      - ./src/wp-content/themes:/var/www/html/wp-content/themes
      - ./src/wp-content/plugins:/var/www/html/wp-content/plugins
      - ./src/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - wp-uploads:/var/www/html/wp-content/uploads
    networks:
      - wp-network
    profiles:
      - tools

volumes:
  db-data:
  wp-core:
  wp-uploads:

networks:
  wp-network:
    driver: bridge
