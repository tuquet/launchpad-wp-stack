; =============================================================================
; LaunchPad WordPress Stack - Custom PHP Configuration
; Mount vào container tại /usr/local/etc/php/conf.d/uploads.ini
; Giải quyết lỗi upload theme/plugin lớn (mặc định WP chỉ cho phép 2MB).
; =============================================================================

; ── Upload & Post Size ──────────────────────────────────────────────────────
; Cho phép upload file lớn (theme, plugin, media)
upload_max_filesize = 256M
post_max_size = 256M

; ── Memory ──────────────────────────────────────────────────────────────────
; WordPress cần nhiều RAM cho các thao tác nặng (import/export, page builder)
memory_limit = 512M

; ── Execution Time ──────────────────────────────────────────────────────────
; Tăng thời gian thực thi cho các tác vụ nặng (import dữ liệu, migration)
max_execution_time = 300

; ── Input Variables ─────────────────────────────────────────────────────────
; Cần thiết cho các page builder (Elementor, WPBakery) với nhiều trường dữ liệu
max_input_vars = 5000
